<svg width="2106" height="510" viewBox="-40 -30 2106 510" xmlns="http://www.w3.org/2000/svg">
  <!-- ===== "A" monogram in white (for dark backgrounds) ===== -->
  <g transform="translate(-130 -560)">
    <!-- Left leg of A -->
    <path d="M 380 560
             L 130 1010
             L 300 1010
             L 460 720
             Z" fill="#FFFFFF"/>
    <!-- Right leg of A -->
    <path d="M 500 560
             L 760 1010
             L 590 1010
             L 430 720
             Z" fill="#FFFFFF"/>
    <!-- Peak connecting both legs -->
    <path d="M 380 560 L 500 560 L 460 720 L 430 720 Z" fill="#FFFFFF"/>
  </g>

  <!-- Diagonal arrow sash (slightly lighter white for depth) -->
  <g transform="translate(-130 -560)" fill="#EAF7F4">
    <path d="M 165 1010
             C 300 950, 470 830, 560 690
             L 585 650
             L 700 620
             L 750 730
             L 715 705
             C 560 850, 380 970, 235 1010
             Z"/>
    <path d="M 585 650 L 770 585 L 750 730 Z"/>
  </g>

  <!-- ===== Wordmark "Attenda" ===== -->
  <g fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-weight="700">
    <text x="740" y="390" font-size="380" letter-spacing="-6">Attenda</text>
  </g>
</svg>
